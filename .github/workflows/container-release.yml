name: Container release

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["**"]

permissions:
  contents: read

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.source.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify Git event, release tag and main ancestry
        id: source
        run: node scripts/container-release.mjs verify
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Focused runtime tests
        run: npm test -- src/app/api/health/route.test.ts src/app/api/ready/route.test.ts src/lib/env.test.ts src/lib/storage/index.test.ts src/lib/site-indexing.test.ts src/proxy.test.ts src/app/sitemap.test.ts src/lib/payments src/app/api/payments/create/route.test.ts src/app/api/cron/reconcile-doku-payments/route.test.ts src/lib/cron-auth.test.ts
      - name: Production operations checks
        run: |
          bash scripts/test-production-runtime.sh
          node --test scripts/production-scheduler.test.mjs scripts/container-release.test.mjs
          git diff --check

  image-validation:
    if: needs.validate.outputs.kind == 'validation'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate production Docker build (no publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/Staging' || startsWith(github.ref, 'refs/tags/'))
    needs: validate
    runs-on: ubuntu-latest
    # Candidate/tag jobs share SHA identities: serialize registry writes.
    concurrency:
      group: ngaturi-ghcr-publication
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_IMAGE: ghcr.io/wildanal2/ngaturi-cms
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact Git source and guard immutable identities
        id: release
        run: node scripts/container-release.mjs prepare
      - name: Build and publish exact source image once
        id: build
        if: steps.release.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.RELEASE_IMAGE }}:sha-${{ steps.release.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.created=${{ steps.release.outputs.created }}
            com.ngaturi.ops-sha256=${{ steps.release.outputs.ops_sha256 }}
          provenance: false
      - name: Publish immutable candidate/release tags and manifest
        env:
          RELEASE_DIGEST: ${{ steps.build.outputs.digest || steps.release.outputs.digest }}
        run: node scripts/container-release.mjs publish
      - name: Package production operation files (no source or secrets)
        if: steps.release.outputs.kind == 'release'
        run: python3 ops/production/release.py --package --metadata release-manifest.json --output ngaturi-production-ops.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: container-${{ steps.release.outputs.tag }}-${{ steps.release.outputs.sha }}
          path: |
            release-manifest.json
            ngaturi-production-ops.tar.gz
          if-no-files-found: error
      - name: Publish and verify exact ops asset on GitHub Release
        if: steps.release.outputs.kind == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          asset=ngaturi-production-ops.tar.gz
          repo="$GITHUB_REPOSITORY"
          existing="$RUNNER_TEMP/ngaturi-existing-asset"
          verified="$RUNNER_TEMP/ngaturi-verified-asset"
          mkdir -p "$existing" "$verified"
          if gh release view "$RELEASE_TAG" -R "$repo" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" -R "$repo" --json isDraft --jq .isDraft)
            if gh release download "$RELEASE_TAG" -R "$repo" --pattern "$asset" --dir "$existing"; then
              cmp "$asset" "$existing/$asset" || { echo 'Existing release asset differs; refusing overwrite' >&2; exit 1; }
            elif [[ "$draft" == true ]]; then
              gh release upload "$RELEASE_TAG" "$asset" -R "$repo"
            else
              echo 'Published release lacks its ops asset; refusing silent mutation' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" "$asset" -R "$repo" --verify-tag \
              --title "$RELEASE_TAG" --notes "Immutable Ngaturi CMS release ops asset." \
              --draft --latest=false
            draft=true
          fi
          if [[ "$draft" == true ]]; then
            gh release edit "$RELEASE_TAG" -R "$repo" --draft=false
          fi
          gh release download "$RELEASE_TAG" -R "$repo" --pattern "$asset" --dir "$verified"
          cmp "$asset" "$verified/$asset" || { echo 'Published asset verification failed' >&2; exit 1; }
      - name: Move stable only after complete release and artifact upload
        if: steps.release.outputs.kind == 'release'
        env:
          RELEASE_DIGEST: ${{ steps.build.outputs.digest || steps.release.outputs.digest }}
        run: node scripts/container-release.mjs stable
