name: Container release

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["**"]

permissions:
  contents: read

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.source.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify Git event, release tag and main ancestry
        id: source
        run: node scripts/container-release.mjs verify
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Focused runtime tests
        run: npm test -- src/app/api/ready/route.test.ts src/lib/env.test.ts src/lib/storage/index.test.ts src/lib/site-indexing.test.ts src/proxy.test.ts src/app/sitemap.test.ts src/lib/payments/doku.test.ts src/app/api/cron/reconcile-doku-payments/route.test.ts src/lib/cron-auth.test.ts
      - name: Production operations checks
        run: |
          bash scripts/test-production-runtime.sh
          node --test scripts/production-scheduler.test.mjs scripts/container-release.test.mjs
          git diff --check

  image-validation:
    if: needs.validate.outputs.kind == 'validation'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate production Docker build (no publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/Staging' || startsWith(github.ref, 'refs/tags/'))
    needs: validate
    runs-on: ubuntu-latest
    # Candidate/tag jobs share SHA identities: serialize registry writes.
    concurrency:
      group: ngaturi-ghcr-publication
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_IMAGE: ghcr.io/wildanal2/ngaturi-cms
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact Git source and guard immutable identities
        id: release
        run: node scripts/container-release.mjs prepare
      - name: Build and publish exact source image once
        id: build
        if: steps.release.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.RELEASE_IMAGE }}:sha-${{ steps.release.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.created=${{ steps.release.outputs.created }}
          provenance: false
      - name: Publish immutable candidate/release tags and manifest
        env:
          RELEASE_DIGEST: ${{ steps.build.outputs.digest || steps.release.outputs.digest }}
        run: node scripts/container-release.mjs publish
      - name: Package production operation files (no source or secrets)
        if: steps.release.outputs.kind == 'release'
        run: tar -C ops/production -czf ngaturi-production-ops.tar.gz compose.yml deploy.sh rollback.sh scheduler.crontab scheduler.mjs deploy.env.example README.md GIT_RELEASE.md ngaturi-runtime.service
      - uses: actions/upload-artifact@v4
        with:
          name: container-${{ steps.release.outputs.tag }}-${{ steps.release.outputs.sha }}
          path: |
            release-manifest.json
            ngaturi-production-ops.tar.gz
          if-no-files-found: error
      - name: Move stable only after complete release and artifact upload
        if: steps.release.outputs.kind == 'release'
        env:
          RELEASE_DIGEST: ${{ steps.build.outputs.digest || steps.release.outputs.digest }}
        run: node scripts/container-release.mjs stable
