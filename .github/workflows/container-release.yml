name: Container release

on:
  pull_request:
  workflow_dispatch:
  push:
    # GitHub cannot dispatch a new workflow until it exists on the default branch.
    # A marker on this feature branch enables one intentional validation publish.
    branches: [main, feat/cloudflare-staging-migration]

permissions:
  contents: read

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Focused runtime tests
        run: npm test -- src/app/api/ready/route.test.ts src/lib/env.test.ts src/lib/storage/index.test.ts

  pr-image:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate production Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false

  publish:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/feat/cloudflare-staging-migration' && contains(github.event.head_commit.message, '[publish-image]'))
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Select repository package
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build production artifact once
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
      - name: Write non-secret release manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT: ${{ github.sha }}
        run: |
          test -n "$DIGEST"
          printf '{"git_sha":"%s","image":"%s@%s","digest":"%s","architecture":"linux/amd64","built_at":"%s"}\n' \
            "$COMMIT" "$IMAGE" "$DIGEST" "$DIGEST" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > release-manifest.json
          cat release-manifest.json
          echo "Immutable image: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
