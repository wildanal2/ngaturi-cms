name: ngaturi-prod

services:
  app:
    image: ${NGATURI_IMAGE:?Set NGATURI_IMAGE to a GHCR sha256 digest reference}
    init: true
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:?Set RUNTIME_ENV_FILE to an absolute external env file}
    environment:
      NODE_ENV: production
      PORT: ${NGATURI_CONTAINER_PORT:-8080}
    ports:
      - "${NGATURI_BIND_IP:-127.0.0.1}:${NGATURI_HOST_PORT:-8080}:${NGATURI_CONTAINER_PORT:-8080}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/api/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
