name: ngaturi-bind-dev

services:
  app:
    image: ngaturi-dev:local
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        DEV_UID: ${DEV_UID:-1001}
        DEV_GID: ${DEV_GID:-1001}
    init: true
    restart: unless-stopped
    env_file:
      - .env.local
      - .dev.vars
      - .env.neon.local
    environment:
      NODE_ENV: development
      PORT: "3009"
      ALLOWED_DEV_ORIGINS: dev.ngaturi.com
    ports:
      - "127.0.0.1:3009:3009"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  node_modules:
  next_cache:
