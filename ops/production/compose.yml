name: ${NGATURI_PROJECT_NAME:-ngaturi-prod}

services:
  app:
    image: ${NGATURI_IMAGE:?Use deploy.sh to supply an immutable GHCR digest}
    init: true
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:-/etc/ngaturi/ngaturi.env}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "8080"
    ports:
      - "${NGATURI_BIND_IP:-192.168.88.4}:${NGATURI_PORT:-3009}:8080"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8080/api/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  scheduler:
    image: ${NGATURI_IMAGE:?Use deploy.sh to supply an immutable GHCR digest}
    # A fixed name prevents Compose from scaling this scheduler above one.
    container_name: ${NGATURI_PROJECT_NAME:-ngaturi-prod}-scheduler
    profiles: [scheduler]
    init: true
    restart: unless-stopped
    command: [ops/production/scheduler.mjs]
    env_file:
      - ${RUNTIME_ENV_FILE:-/etc/ngaturi/ngaturi.env}
    environment:
      TZ: UTC
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./scheduler.crontab:/app/ops/production/scheduler.crontab:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 260s
    logging: *logging

networks:
  default:
    driver: bridge
